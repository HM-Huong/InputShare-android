name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Rename APKs
        run: |
          find app/build/outputs/apk/debug -name "*.apk" -exec mv {} app/build/outputs/apk/debug/reporter.apk \;
          find app/build/outputs/apk/release -name "*.apk" -exec mv {} app/build/outputs/apk/release/reporter.apk \;

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: reporter-debug
          path: app/build/outputs/apk/debug/reporter.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: reporter-release
          path: app/build/outputs/apk/release/reporter.apk
